  <path d="M180 416 Q220 406 262 414" fill="none" stroke="#2e2e2e" stroke-width="2.5" opacity="0.5"/>

  <!-- steam -->
  <path d="M300 190 C288 172 312 158 300 140 C290 126 310 112 302 94" fill="none" stroke="url(#steam)" stroke-width="10" stroke-linecap="round"/>
  <path d="M318 196 C308 180 328 168 318 150 C310 136 326 122 320 104" fill="none" stroke="url(#steam)" stroke-width="8" stroke-linecap="round"/>

