<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -70 420 530" width="420" height="530">
  <defs>
    <radialGradient id="body" cx="45%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#9a7448"/>
      <stop offset="55%" stop-color="#7d5b36"/>
      <stop offset="100%" stop-color="#543c22"/>
    </radialGradient>
    <radialGradient id="belly" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f2e3c4"/>
      <stop offset="70%" stop-color="#ddb98c"/>
      <stop offset="100%" stop-color="#b98f5e"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f4e7cd"/>
      <stop offset="80%" stop-color="#d3ac78"/>
