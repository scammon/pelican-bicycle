    <path d="M162 -44 C162 -34 258 -34 258 -44 C258 -60 162 -60 162 -44 Z" fill="#7a1f1f"/>
    <ellipse cx="210" cy="-46" rx="48" ry="7" fill="#8f2a2a"/>
    <ellipse cx="210" cy="-48" rx="48" ry="7" fill="#6e1a1a"/>
