<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- teacup saucer -->
  <ellipse cx="150" cy="128" rx="34" ry="7" fill="#c9d6df" stroke="#8fa5b5" stroke-width="1.5"/>
  <!-- steaming cup -->
  <path d="M126 104 L172 104 L166 126 L132 126 Z" fill="#e8f0f5" stroke="#8fa5b5" stroke-width="1.5"/>
  <ellipse cx="149" cy="104" rx="23" ry="5" fill="#a7c6d1" stroke="#8fa5b5" stroke-width="1.5"/>
  <!-- steam -->
  <path d="M140 92 C136 86, 144 82, 140 76 C137 71, 143 68, 141 63" fill="none" stroke="#b8c9d4" stroke-width="2" stroke-linecap="round"/>
  <path d="M152 88 C148 83, 156 79, 152 73 C149 69, 155 66, 153 61" fill="none" stroke="#b8c9d4" stroke-width="2" stroke-linecap="round"/>
  <!-- owl body -->
  <ellipse cx="90" cy="118" rx="42" ry="46" fill="#8b6f47" stroke="#5c4a2e" stroke-width="2"/>
  <!-- belly -->
  <ellipse cx="90" cy="126" rx="28" ry="32" fill="#d9c39a"/>
  <path d="M72 118 q9 7 18 0 q9 -7 18 0 M68 132 q9 7 18 0 q9 -7 18 0 q9 7 14 0" fill="none" stroke="#b39a6d" stroke-width="2"/>
  <!-- head -->
  <circle cx="90" cy="66" r="34" fill="#8b6f47" stroke="#5c4a2e" stroke-width="2"/>
  <!-- ear tufts -->
  <path d="M62 46 L54 26 L74 40 Z" fill="#8b6f47" stroke="#5c4a2e" stroke-width="2"/>
  <path d="M118 46 L126 26 L106 40 Z" fill="#8b6f47" stroke="#5c4a2e" stroke-width="2"/>
  <!-- eyes -->
  <circle cx="76" cy="64" r="13" fill="#fff"/>
  <circle cx="104" cy="64" r="13" fill="#fff"/>
  <circle cx="78" cy="66" r="6" fill="#2e2618"/>
  <circle cx="102" cy="66" r="6" fill="#2e2618"/>
  <circle cx="80" cy="64" r="2" fill="#fff"/>
  <circle cx="104" cy="64" r="2" fill="#fff"/>
  <!-- beak (drinking from cup) -->
  <path d="M88 76 L92 88 L96 76 Z" fill="#e0a93c" stroke="#a97b22" stroke-width="1.5"/>
  <!-- wings raised to cup -->
  <path d="M48 100 Q34 112 44 130 Q58 122 62 106 Z" fill="#735a38" stroke="#5c4a2e" stroke-width="2"/>
  <path d="M108 116 Q128 108 140 118 Q144 104 132 96 Q116 92 104 104 Z" fill="#735a38" stroke="#5c4a2e" stroke-width="2"/>
  <!-- tophat -->
  <path d="M64 42 L116 42 L114 38 Q118 10 90 8 Q62 10 66 38 Z" fill="#222"/>
  <path d="M64 42 L116 42 L114 38 Q118 10 90 8 Q62 10 66 38 Z" fill="none" stroke="#111" stroke-width="2"/>
  <ellipse cx="90" cy="42" rx="34" ry="7" fill="#222" stroke="#111" stroke-width="2"/>
  <rect x="64" y="34" width="52" height="8" fill="#8b6f47" opacity="0"/>
  <!-- hat band -->
  <path d="M66 36 Q90 30 114 36 L114 42 Q90 36 66 42 Z" fill="#c0392b"/>
  <!-- perched feet on rock -->
  <ellipse cx="90" cy="164" rx="30" ry="8" fill="#6b6b6b"/>
  <path d="M72 160 L68 172 M72 160 L74 172 M80 160 L76 173 M80 160 L82 173 M100 160 L96 172 M100 160 L102 172 M108 160 L104 173 M108 160 L110 173" stroke="#2e2618" stroke-width="2.5" stroke-linecap="round"/>
</svg>
